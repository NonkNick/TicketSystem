services:
    laravel.test:
        build: .
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql

    nginx:
        image: nginx:alpine
        ports:
            - '80:80'
        volumes:
            - '.:/var/www/html'
            - './nginx.conf:/etc/nginx/conf.d/default.conf'
        depends_on:
            - laravel.test
        networks:
            - sail

    node:
        image: 'node:20-alpine'
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        ports:
            - '5173:5173'
        command: sh -c 'npm install && npm run dev'
        networks:
            - sail

    mysql:
        image: 'mysql:8.0'
        ports:
            - '3306:3306'
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: sail
            MYSQL_PASSWORD: password
            MYSQL_ROOT_PASSWORD: password
        volumes:
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - sail

    redis:
        image: 'redis:7-alpine'
        ports:
            - '6380:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
    sail-redis:
